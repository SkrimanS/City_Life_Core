function setTransform(){canvas.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;wrap.style.backgroundPosition=`${tx%42}px ${ty%42}px`}function setTool(t){tool=t;$('toolPan').classList.toggle('gold',t==='pan');$('toolEdit').classList.toggle('gold',t==='edit');wrap.className=t==='pan'||space?'pan':'edit'}
function path(){let start=state.nodes.find(n=>n.main),out=[],seen=new Set;while(start&&!seen.has(start.id)){out.push(start);seen.add(start.id);let l=state.links.find(x=>x.from===start.id&&x.type==='main');start=l?node(l.to):null}return out}
function draw(){nodesEl.innerHTML='';edges.innerHTML='';for(const l of state.links){let a=node(l.from),b=node(l.to);if(!a||!b)continue;let x1=a.x+255,y1=a.y+58,x2=b.x,y2=b.y+58,mx=(x1+x2)/2,c=l.type==='main'?'#d6a34a':l.type==='return'?'#8ab36b':l.type==='danger'?'#bd6658':'#74acd0';let p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);p.setAttribute('stroke',c);p.setAttribute('stroke-width',l.type==='main'?3:2);p.setAttribute('stroke-dasharray',l.type==='main'?'':'4 5');p.setAttribute('fill','none');p.setAttribute('opacity','.85');edges.appendChild(p);let t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',mx);t.setAttribute('y',(y1+y2)/2-6);t.setAttribute('fill',c);t.setAttribute('font-size','12');t.setAttribute('text-anchor','middle');t.textContent=l.label||l.type;edges.appendChild(t)}for(const n of state.nodes){let d=document.createElement('div');d.className=`node ${n.type} ${n.main?'main':''} ${n.id===selected?'sel':''}`;d.style.left=n.x+'px';d.style.top=n.y+'px';d.dataset.id=n.id;d.innerHTML=`<div class="type">${esc(n.act||n.type)}</div><div class="title">${esc(n.title)}</div><div class="desc">${esc(n.summary)}</div><div class="row" style="margin-top:9px"><span class="chip ${n.main?'':'blue'}">${n.main?'основа':'ветка'}</span><span class="chip green">${(state.dialogs[n.id]||[]).reduce((a,l)=>a+(l.choices||[]).length,0)} реплик</span></div>`;d.onpointerdown=e=>startNode(e,n);d.onclick=e=>{selected=n.id;save();render()};nodesEl.appendChild(d)}}
function buildList(){let q=$('search').value.toLowerCase();let list=state.nodes.filter(n=>(filter==='all'||(filter==='main'&&n.main)||(filter==='branch'&&!n.main)||n.type===filter)&&(`${n.title} ${n.summary} ${(n.tags||[]).join(' ')}`.toLowerCase().includes(q)));$('list').innerHTML=list.map(n=>`<div class="mini ${n.id===selected?'sel':''}" onclick="selectNode('${n.id}')"><b>${esc(n.title)}</b><div>${esc(n.summary).slice(0,90)}...</div><div class="row" style="margin-top:6px"><span class="chip">${n.main?'основа':'ветка'}</span><span class="chip blue">${esc(n.npc||'')}</span></div></div>`).join('')}
window.selectNode=id=>{selected=id;save();render();center(id)};
function stats(){let main=path().length,branches=state.nodes.length-main,choices=Object.values(state.dialogs).flat().reduce((a,l)=>a+(l.choices||[]).length,0);$('stNodes').textContent=main;$('stBranches').textContent=branches;$('stChoices').textContent=choices;$('stLinear').textContent=Math.round(main/state.nodes.length*100)+'%'}
function renderRight(){let n=node(selected);if(!n){right.innerHTML='';return}if(tab==='play')return playPanel();if(tab==='dialogue')return dialogPanel(n);right.innerHTML=`<div class="card"><div class="row space"><h2 style="margin:0">${esc(n.title)}</h2><span class="chip">${esc(n.type)}</span></div><p>${esc(n.summary)}</p></div><div class="details"><label>Название<input class="field" id="fTitle" value="${esc(n.title)}"></label><div class="grid2"><label>Тип<select id="fType"><option>quest</option><option>dialogue</option><option>danger</option><option>truth</option><option>choice</option></select></label><label>Акт<input class="field" id="fAct" value="${esc(n.act)}"></label></div><div class="grid2"><label>NPC<input class="field" id="fNpc" value="${esc(n.npc)}"></label><label>Локация<input class="field" id="fLoc" value="${esc(n.location)}"></label></div><label>Описание<textarea id="fSum">${esc(n.summary)}</textarea></label><label>Задачи, каждая с новой строки<textarea id="fObj">${esc((n.objective||[]).join('\n'))}</textarea></label><label>Теги через запятую<input class="field" id="fTags" value="${esc((n.tags||[]).join(', '))}"></label><div class="grid2"><label>Флаги условия<input class="field" id="fNeed" value="${esc((n.need||[]).join(', '))}"></label><label>Флаги результата<input class="field" id="fSet" value="${esc((n.set||[]).join(', '))}"></label></div><label><input type="checkbox" id="fMain" ${n.main?'checked':''}> Входит в основную линейную цепочку</label><div class="row"><button class="btn gold" onclick="saveQuest()">Сохранить</button><button class="btn" onclick="addQuest()">Дублировать/новый узел</button><button class="btn red" onclick="deleteQuest()">Удалить</button></div></div><h2>Связи выбранного узла</h2>${state.links.filter(l=>l.from===n.id||l.to===n.id).map(l=>`<div class="card"><span class="chip">${esc(l.type)}</span> ${esc(node(l.from)?.title)} → ${esc(node(l.to)?.title)}<br><span class="tiny">${esc(l.label)}</span> <button class="btn" onclick="editLink('${l.id}')">править</button></div>`).join('')||'<p class="hint">Связей нет.</p>'}<button class="btn green" onclick="addLink()">+ Связь из этого узла</button>`;$('fType').value=n.type}
window.saveQuest=()=>{let n=node(selected);Object.assign(n,{title:$('fTitle').value,type:$('fType').value,act:$('fAct').value,npc:$('fNpc').value,location:$('fLoc').value,summary:$('fSum').value,objective:$('fObj').value.split('\n').map(x=>x.trim()).filter(Boolean),tags:split($('fTags').value),need:split($('fNeed').value),set:split($('fSet').value),main:$('fMain').checked});save();render()};
window.addQuest=()=>{let n=node(selected),id='q'+Math.random().toString(36).slice(2,7),copy={...n,id,title:'Новый квест',x:n.x+120,y:n.y+150,main:false};state.nodes.push(copy);state.dialogs[id]=[{id:'d1',speaker:copy.npc||'NPC',text:'Новая реплика.',choices:[]}];selected=id;save();render()};
window.deleteQuest=()=>{if(state.nodes.length<2||!confirm('Удалить узел?'))return;state.nodes=state.nodes.filter(n=>n.id!==selected);state.links=state.links.filter(l=>l.from!==selected&&l.to!==selected);delete state.dialogs[selected];selected=state.nodes[0].id;save();render()};
function dialogPanel(n){let lines=state.dialogs[n.id]||[];right.innerHTML=`<h2>${esc(n.title)} — диалог</h2><p class="hint">Каждая реплика может выдавать флаги и вести к другой реплике или квесту.</p><button class="btn green" onclick="addLine()">+ Реплика</button>${lines.map((l,i)=>`<div class="dialog-line"><label>Кто говорит<input class="field" value="${esc(l.speaker)}" onchange="updLine(${i},'speaker',this.value)"></label><label>Текст<textarea onchange="updLine(${i},'text',this.value)">${esc(l.text)}</textarea></label><div class="row"><button class="btn" onclick="addChoice(${i})">+ ответ</button><button class="btn red" onclick="delLine(${i})">удалить</button></div>${(l.choices||[]).map((c,j)=>`<div class="choice-row"><label>Ответ игрока<input class="field" value="${esc(c.text)}" onchange="updChoice(${i},${j},'text',this.value)"></label><div class="grid2"><label>К реплике<input class="field" value="${esc(c.target||'')}" onchange="updChoice(${i},${j},'target',this.value)"></label><label>К квесту<select onchange="updChoice(${i},${j},'nextQuest',this.value)"><option value="">—</option>${state.nodes.map(nn=>`<option value="${nn.id}" ${c.nextQuest===nn.id?'selected':''}>${esc(nn.title)}</option>`).join('')}</select></label></div><div class="grid2"><label>Нужно<input class="field" value="${esc(c.requires||'')}" onchange="updChoice(${i},${j},'requires',this.value)"></label><label>Выдаёт<input class="field" value="${esc(c.sets||'')}" onchange="updChoice(${i},${j},'sets',this.value)"></label></div><button class="btn red" onclick="delChoice(${i},${j})">удалить ответ</button></div>`).join('')}</div>`).join('')}`}
window.updLine=(i,k,v)=>{(state.dialogs[selected]||[])[i][k]=v;save();draw()};window.addLine=()=>{(state.dialogs[selected]||(state.dialogs[selected]=[])).push({id:'d'+Math.random().toString(36).slice(2,5),speaker:node(selected).npc||'NPC',text:'Новая реплика.',choices:[]});save();renderRight()};window.delLine=i=>{state.dialogs[selected].splice(i,1);save();renderRight()};window.addChoice=i=>{state.dialogs[selected][i].choices.push({text:'Ответ игрока',target:'',nextQuest:'',requires:'',sets:''});save();renderRight()};window.updChoice=(i,j,k,v)=>{state.dialogs[selected][i].choices[j][k]=v;save()};window.delChoice=(i,j)=>{state.dialogs[selected][i].choices.splice(j,1);save();renderRight()};
let play={quest:null,line:null,flags:[],log:[]};function playPanel(){let q=node(play.quest||selected),lines=state.dialogs[q.id]||[],line=lines.find(l=>l.id===play.line)||lines[0];play.quest=q.id;play.line=line?.id;right.innerHTML=`<h2>Тест прохождения</h2><div class="row"><button class="btn gold" onclick="startPlay('${selected}')">Старт с выбранного</button><button class="btn" onclick="play.flags=[];play.log=[];renderRight()">Очистить</button></div><div class="play">${line?`<div class="speaker">${esc(line.speaker)}</div><div class="playtext">${esc(line.text)}</div>${(line.choices||[]).map((c,i)=>`<button class="btn choicebtn ${ok(c.requires)?'':'locked'}" onclick="choose(${i})">${esc(c.text)}${ok(c.requires)?'':' · нужно '+esc(c.requires)}</button>`).join('')||'<button class="btn choicebtn" onclick="nextMain()">Продолжить по основной связи</button>'}`:'<p>Нет реплик.</p>'}</div><h2>Флаги</h2><div class="card">${play.flags.map(f=>`<span class="chip green">${esc(f)}</span>`).join(' ')||'<span class="tiny">пока пусто</span>'}</div><h2>Лог</h2><div class="log">${esc(play.log.join('\n'))}</div>`}
function ok(s){return split(s).every(f=>play.flags.includes(f))}function give(s){for(const f of split(s))if(!play.flags.includes(f))play.flags.push(f)}window.startPlay=id=>{play={quest:id,line:(state.dialogs[id]||[])[0]?.id,flags:[...(node(id).need||[])],log:['Старт: '+node(id).title]};tab='play';setRightTab();renderRight()};window.choose=i=>{let lines=state.dialogs[play.quest]||[],l=lines.find(x=>x.id===play.line),c=l.choices[i];if(!ok(c.requires)){play.log.push('Недоступно: '+c.requires);return renderRight()}give(c.sets);play.log.push('Выбор: '+c.text);if(c.nextQuest){selected=c.nextQuest;play.quest=c.nextQuest;play.line=(state.dialogs[c.nextQuest]||[])[0]?.id;give((node(c.nextQuest).set||[]).join(','))}else if(c.target)play.line=c.target;save();render()};window.nextMain=()=>{let l=state.links.find(x=>x.from===play.quest&&x.type==='main')||state.links.find(x=>x.from===play.quest);if(!l)return;selected=l.to;play.quest=l.to;play.line=(state.dialogs[l.to]||[])[0]?.id;play.log.push('Переход: '+node(l.to).title);render()};
window.addLink=()=>editLink(null);window.editLink=id=>{let l=id?state.links.find(x=>x.id===id):{id:'l'+Math.random().toString(36).slice(2,7),from:selected,to:state.nodes.find(n=>n.id!==selected).id,type:'branch',label:'новая связь',condition:''};$('modalTitle').textContent=id?'Правка связи':'Новая связь';$('modalBody').innerHTML=`<div class="grid2"><label>Откуда<select id="lf">${state.nodes.map(n=>`<option value="${n.id}" ${l.from===n.id?'selected':''}>${esc(n.title)}</option>`).join('')}</select></label><label>Куда<select id="lt">${state.nodes.map(n=>`<option value="${n.id}" ${l.to===n.id?'selected':''}>${esc(n.title)}</option>`).join('')}</select></label></div><label>Тип<select id="ltype"><option>main</option><option>branch</option><option>return</option><option>danger</option><option>condition</option></select></label><label>Подпись<input class="field" id="llabel" value="${esc(l.label)}"></label><label>Условие<input class="field" id="lcond" value="${esc(l.condition)}"></label><div class="row"><button class="btn gold" onclick="saveLink('${id||''}')">Сохранить</button>${id?`<button class="btn red" onclick="delLink('${id}')">Удалить</button>`:''}</div>`;$('ltype').value=l.type;$('modal').classList.add('on')};window.saveLink=id=>{let l=id?state.links.find(x=>x.id===id):{id:'l'+Math.random().toString(36).slice(2,7)};Object.assign(l,{from:$('lf').value,to:$('lt').value,type:$('ltype').value,label:$('llabel').value,condition:$('lcond').value});if(!id)state.links.push(l);closeModal();save();render()};window.delLink=id=>{state.links=state.links.filter(l=>l.id!==id);closeModal();save();render()};window.closeModal=()=>$('modal').classList.remove('on');
function startNode(e,n){if((tool==='pan'||space)){startPan(e);return}e.preventDefault();selected=n.id;let sx=e.clientX,sy=e.clientY,ox=n.x,oy=n.y;drag={move:ev=>{n.x=ox+(ev.clientX-sx)/scale;n.y=oy+(ev.clientY-sy)/scale;draw()},up:()=>{window.removeEventListener('pointermove',drag.move);window.removeEventListener('pointerup',drag.up);drag=null;save();render()}};window.addEventListener('pointermove',drag.move);window.addEventListener('pointerup',drag.up)}function startPan(e){e.preventDefault();wrap.classList.add('dragging');let sx=e.clientX,sy=e.clientY,ox=tx,oy=ty;pan={move:ev=>{tx=ox+ev.clientX-sx;ty=oy+ev.clientY-sy;setTransform()},up:()=>{wrap.classList.remove('dragging');window.removeEventListener('pointermove',pan.move);window.removeEventListener('pointerup',pan.up);pan=null}};window.addEventListener('pointermove',pan.move);window.addEventListener('pointerup',pan.up)}wrap.addEventListener('pointerdown',e=>{if(e.target===wrap||e.target===canvas||e.target===nodesEl||e.target===edges)startPan(e)});wrap.addEventListener('wheel',e=>{e.preventDefault();let r=wrap.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,wx=(mx-tx)/scale,wy=(my-ty)/scale;scale=Math.max(.22,Math.min(1.4,scale+(e.deltaY<0?.08:-.08)));tx=mx-wx*scale;ty=my-wy*scale;setTransform()},{passive:false});
function center(id=selected){let n=node(id),r=wrap.getBoundingClientRect();if(!n)return;tx=r.width/2-(n.x+127)*scale;ty=r.height/2-(n.y+58)*scale;setTransform()}function autoLayout(){let p=path();p.forEach((n,i)=>{n.x=60+i*310;n.y=360;n.main=true});let b=state.nodes.filter(n=>!p.includes(n));b.forEach((n,i)=>{let par=node((state.links.find(l=>l.to===n.id)||{}).from)||p[Math.min(i,p.length-1)];n.x=(par?.x||600)+90;n.y=i%2?620:120});save();render()}window.autoLayout=autoLayout;
function render(){draw();buildList();stats();renderRight();setTransform()}function setRightTab(){document.querySelectorAll('#rightTabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
$('search').oninput=buildList;document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;buildList()});document.querySelectorAll('#rightTabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;setRightTab();renderRight()});document.querySelectorAll('#viewTabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#viewTabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.tab==='dialogue'||b.dataset.tab==='play'){tab=b.dataset.tab;setRightTab();renderRight()}});$('toolPan').onclick=()=>setTool('pan');$('toolEdit').onclick=()=>setTool('edit');$('zin').onclick=()=>{scale=Math.min(1.4,scale+.08);setTransform()};$('zout').onclick=()=>{scale=Math.max(.22,scale-.08);setTransform()};$('reset').onclick=()=>{scale=.52;tx=70;ty=70;setTransform()};$('center').onclick=()=>center();window.onkeydown=e=>{if(e.target.matches('input,textarea,select'))return;if(e.key.toLowerCase()==='h')setTool('pan');if(e.key.toLowerCase()==='v')setTool('edit');if(e.code==='Space'){space=true;setTool(tool);e.preventDefault()}};window.onkeyup=e=>{if(e.code==='Space'){space=false;setTool(tool)}};
window.exportJSON=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='bezdna_quests.json';a.click()};
setTool('pan');render();center(selected);
</script>
